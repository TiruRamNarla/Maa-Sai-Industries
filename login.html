<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management Portal | MAA SAI METAL INDUSTRIES</title>
    
    <!-- PREMIUM INDUSTRIAL FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- FONT AWESOME ICONS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary-navy: #0f172a;
            --accent-gold: #f59e0b;
            --accent-gold-dark: #d97706;
            --accent-blue: #2563eb;
            --bg-light: #f8fafc;
            --surface-white: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
            --danger: #ef4444;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            font-family: var(--font-body);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background: var(--surface-white);
            border: 1.5px solid var(--border-color);
            border-top: 5px solid var(--primary-navy);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.12);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .brand-header h1 {
            font-family: var(--font-heading);
            font-size: 21px;
            font-weight: 900;
            color: var(--primary-navy);
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .brand-header p {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-gold-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-family: var(--font-heading);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--primary-navy);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        .form-control {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-navy);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .alert-error {
            display: none;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <img src="/logo.jpeg" alt="MAA SAI METAL Logo" class="brand-logo-img" onerror="this.src='/logo.jpg'">
            <h1>MAA SAI METAL</h1>
            <p>Admin Management Portal</p>
        </div>

        <div id="errorMessage" class="alert-error">
            <i class="fa-solid fa-circle-exclamation"></i> Invalid Admin Credentials
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="admin or gopi_achanti" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-submit">Login to Dashboard ➔</button>
        </form>

        <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Main Website</a>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById("username").value;
            const passwordInput = document.getElementById("password").value;
            const errorDiv = document.getElementById("errorMessage");

            errorDiv.style.display = "none";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem("maasai_admin_logged_in", "true");
                    localStorage.setItem("maasai_admin_user", data.user || usernameInput);
                    window.location.href = "/admin-dashboard.html";
                } else {
                    errorDiv.innerText = data.message || "Invalid Admin Credentials";
                    errorDiv.style.display = "block";
                }
            } catch (err) {
                errorDiv.innerText = "Server connection error. Please try again.";
                errorDiv.style.display = "block";
            }
        }
    </script>
</body>
</html>
