<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Order Tracking | MAA SAI METAL INDUSTRIES</title>
    
    <!-- PREMIUM INDUSTRIAL FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- FONT AWESOME ICONS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary-navy: #0f172a;
            --accent-gold: #f59e0b;
            --accent-gold-dark: #d97706;
            --accent-blue: #2563eb;
            --success-green: #166534;
            --bg-light: #f8fafc;
            --surface-white: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }

        body {
            background-color: var(--bg-light);
            font-family: var(--font-body);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .track-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .header-box {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-img {
            height: 60px;
            width: auto;
            margin-bottom: 12px;
            object-fit: contain;
        }

        .header-box h1 {
            font-family: var(--font-heading);
            font-size: 26px;
            font-weight: 900;
            color: var(--primary-navy);
            letter-spacing: -0.5px;
        }

        .header-box p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* SEARCH BOX */
        .search-card {
            background: var(--surface-white);
            border: 1.5px solid var(--border-color);
            border-top: 5px solid var(--accent-blue);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 12px;
        }

        .search-input {
            flex: 1;
            padding: 14px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-mono);
            color: var(--text-dark);
            background: #ffffff;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-track {
            background: var(--primary-navy);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
        }

        .btn-track:hover {
            background: var(--accent-blue);
            transform: translateY(-2px);
        }

        /* STATUS DISPLAY CARD */
        .result-card {
            display: none;
            background: var(--surface-white);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .order-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1.5px solid var(--border-color);
        }

        .meta-item label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            font-family: var(--font-heading);
            margin-bottom: 4px;
        }

        .meta-item span {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-navy);
        }

        /* STEPPER */
        .stepper-container {
            margin-top: 30px;
        }

        .stepper-title {
            font-family: var(--font-heading);
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-navy);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .stepper {
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .stepper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 5%;
            right: 5%;
            height: 3px;
            background: var(--border-color);
            z-index: 1;
        }

        .step-item {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
        }

        .step-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 16px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .step-item.active .step-circle {
            border-color: var(--accent-blue);
            background: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
        }

        .step-item.completed .step-circle {
            border-color: var(--success-green);
            background: var(--success-green);
            color: #ffffff;
        }

        .step-label {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-dark);
            text-transform: uppercase;
            font-family: var(--font-heading);
        }

        .alert-error {
            display: none;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            margin-top: 15px;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-blue);
        }

        @media (max-width: 600px) {
            .search-form { flex-direction: column; }
            .stepper { flex-direction: column; gap: 20px; align-items: flex-start; }
            .stepper::before { display: none; }
            .step-item { display: flex; align-items: center; gap: 15px; }
            .step-circle { margin: 0; }
        }
    </style>
</head>
<body>

    <div class="track-container">
        <div class="header-box">
            <img src="/logo.jpeg" alt="MAA SAI METAL Logo" class="logo-img" onerror="this.src='/logo.jpg'">
            <h1>MAA SAI METAL INDUSTRIES</h1>
            <p>Live Manufacturing & Order Tracking Portal</p>
        </div>

        <div class="search-card">
            <form class="search-form" onsubmit="trackOrder(event)">
                <input type="text" id="orderIdInput" class="search-input" placeholder="Enter Order ID (e.g., MSM-ORD-1002)" required>
                <button type="submit" class="btn-track">Track Order ➔</button>
            </form>
            <div id="errorAlert" class="alert-error"></div>
        </div>

        <div id="resultCard" class="result-card">
            <div class="order-meta-grid">
                <div class="meta-item">
                    <label>Order ID</label>
                    <span id="dispOrderId" style="font-family: var(--font-mono); color: var(--accent-blue);">--</span>
                </div>
                <div class="meta-item">
                    <label>Customer Name</label>
                    <span id="dispCustomer">--</span>
                </div>
                <div class="meta-item">
                    <label>Structure / Items</label>
                    <span id="dispItem">--</span>
                </div>
                <div class="meta-item">
                    <label>Expected Dispatch</label>
                    <span id="dispDispatch" style="color: var(--success-green);">--</span>
                </div>
            </div>

            <div class="stepper-container">
                <div class="stepper-title">Manufacturing Status Lifecycle</div>
                
                <div class="stepper">
                    <div class="step-item" id="step-1">
                        <div class="step-circle"><i class="fa-solid fa-boxes-stacked"></i></div>
                        <div class="step-label">Raw Material</div>
                    </div>
                    <div class="step-item" id="step-2">
                        <div class="step-circle"><i class="fa-solid fa-gears"></i></div>
                        <div class="step-label">Fabrication</div>
                    </div>
                    <div class="step-item" id="step-3">
                        <div class="step-circle"><i class="fa-solid fa-circle-dot"></i></div>
                        <div class="step-label">Punching</div>
                    </div>
                    <div class="step-item" id="step-4">
                        <div class="step-circle"><i class="fa-solid fa-fire-burner"></i></div>
                        <div class="step-label">Galvanizing</div>
                    </div>
                    <div class="step-item" id="step-5">
                        <div class="step-circle"><i class="fa-solid fa-clipboard-check"></i></div>
                        <div class="step-label">Inspection</div>
                    </div>
                    <div class="step-item" id="step-6">
                        <div class="step-circle"><i class="fa-solid fa-truck-ramp-box"></i></div>
                        <div class="step-label">Dispatch</div>
                    </div>
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Main Website</a>
        </div>
    </div>

    <script>
        const STAGE_MAP = {
            'Raw Material': 1,
            'Fabrication': 2,
            'Punching': 3,
            'Drilling': 3,
            'Galvanizing': 4,
            'Inspection': 5,
            'Packing': 5,
            'Dispatch': 6,
            'Delivered': 6
        };

        async function trackOrder(event) {
            event.preventDefault();
            const orderId = document.getElementById("orderIdInput").value.trim();
            const errorAlert = document.getElementById("errorAlert");
            const resultCard = document.getElementById("resultCard");

            errorAlert.style.display = "none";
            resultCard.style.display = "none";

            try {
                const response = await fetch(`/api/orders/track/${encodeURIComponent(orderId)}`);
                const data = await response.json();

                if (response.ok && data.success) {
                    const order = data.order;
                    document.getElementById("dispOrderId").innerText = order.orderId || orderId;
                    document.getElementById("dispCustomer").innerText = order.customerName || order.customer || 'Client';
                    document.getElementById("dispItem").innerText = order.item || 'Steel Structure';
                    document.getElementById("dispDispatch").innerText = order.expectedDispatch ? new Date(order.expectedDispatch).toLocaleDateString('en-IN') : 'Scheduled';

                    // Update Stepper
                    const currentStepNum = STAGE_MAP[order.currentStage] || 1;
                    
                    for (let i = 1; i <= 6; i++) {
                        const stepEl = document.getElementById(`step-${i}`);
                        stepEl.classList.remove("active", "completed");
                        
                        if (i < currentStepNum) {
                            stepEl.classList.add("completed");
                        } else if (i === currentStepNum) {
                            stepEl.classList.add("active");
                        }
                    }

                    resultCard.style.display = "block";
                } else {
                    errorAlert.innerText = data.message || "Order ID not found. Please verify your order reference.";
                    errorAlert.style.display = "block";
                }
            } catch (err) {
                errorAlert.innerText = "Error connecting to server. Please try again.";
                errorAlert.style.display = "block";
            }
        }
    </script>
</body>
</html>
